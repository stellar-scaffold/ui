[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.0.2"
# Optional: fill these in to include your project's metadata in contract Wasm.
authors = []
homepage = ""
repository = ""

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-access = "0.8.0"
stellar-macros = "0.8.0"
stellar-tokens = "0.8.0"
stellar-registry = "0.1.0"
stellar-xdr = "28.0.0"

[profile.release]
opt-level = "z"
debug = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
